<!DOCTYPE html>
<html>
<head>
<title>Strudel Keyframe Renderer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080808; overflow: hidden; }
  .cm-editor { background: #080808 !important; }
  #editor { width: 100vw; height: 100vh; padding: 12px 16px; }
  .cm-editor { height: 100%; font-size: 12px; }
  .cm-scroller { overflow: hidden !important; }
  .cm-gutters { display: none !important; }
  .cm-activeLine { background: transparent !important; }
  .cm-cursor { display: none !important; }
  #watermark {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-family: monospace;
    font-size: 60px;
    color: rgba(255, 255, 255, 0.6);
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="editor"></div>
<div id="watermark">@line.ctrl</div>
<script type="module" src="./keyframes.mjs"></script>
</body>
</html>
