<!DOCTYPE html>
<html>
<head>
<title>Strudel Keyframe Renderer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f2f1f8; overflow: hidden; }
  .cm-editor { background: #f2f1f8 !important; }
  #editor { width: 100vw; height: 100vh; padding: 12px 16px; }
  .cm-editor { height: 100%; font-size: 12px; }
  .cm-scroller { overflow: hidden !important; }
  .cm-gutters { display: none !important; }
  .cm-activeLine { background: transparent !important; }
  .cm-cursor { display: none !important; }
  /* Highlight colour must win over nested syntax-token colours */
  .kf-hl * { color: inherit !important; }
  #watermark {
    position: fixed;
    bottom: 16px;
    left: 100%;
    margin-left: -20px;
    font-family: monospace;
    font-size: 8vh;
    color: rgba(12, 0, 107, 0.25);
    pointer-events: none;
    z-index: 999;
    transform: rotate(-90deg);
    transform-origin: bottom left;
  }
</style>
</head>
<body>
<div id="editor"></div>
<div id="watermark">@line.ctrl</div>
<script type="module" src="./keyframes.mjs"></script>
</body>
</html>
